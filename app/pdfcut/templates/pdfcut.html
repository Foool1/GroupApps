{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF cutter</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <h1>PDF Cutter</h1>

    <div class="exit">
        <a href="{% url 'main-page' %}">Exit</a>
    </div>

    <div class="container">
        <h4>Input pdf file to cut</h4>
        <input type="file" id="pdfInput" accept="application/pdf">
        <button onclick="uploadPDF()">Send</button>
        <p id="status"></p>
    </div>

    <div class="output" id="output"></div>

    <script>
        function uploadPDF() {
            const pdfInput = document.getElementById('pdfInput');
            const status = document.getElementById('status');
            const file = pdfInput.files[0];

            if (!file) {
                status.textContent = 'Choose a PDF file!';
                return;
            }

            const formData = new FormData();
            formData.append('pdf', file);  // Fix key to match backend

            fetch('/api/pdf/', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.filename) {
                    status.textContent = 'PDF Uploaded Successfully!';
                    document.getElementById('output').innerText = `Saved as: ${data.filename}`;
                } else {
                    status.textContent = data.message || 'Error processing PDF!';
                }
            })
            .catch(error => {
                status.textContent = 'Error uploading PDF';
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
